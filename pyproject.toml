[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-imu-collision-studio"
version = "0.1.0"
description = "Desktop workflow for importing, annotating, learning, qualifying, and exporting a dual-IMU collision profile."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14,<2",
  "openpyxl>=3.1",
  "psutil>=5.9",
  "PySide6>=6.8",
  "PyYAML>=6.0",
]

[project.scripts]
dual-imu-collision-studio = "dual_imu_collision_studio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dual_imu_collision_studio = ["qml/*.qml", "qml/*.svg", "qml/components/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
