execution_profiles:
- id: windows-desktop
  status: proposed
  assurance_scope:
  - functional-compatibility
  - performance
  target:
    platform: Windows 10 or Windows 11 x64
    cpu: Four or more logical CPU cores
    runtime: Python 3.11+ with PySide6 Qt Quick
    compiler: Python interpreter; generated headers target external C99 or C++17 compilers
    cache_topology: {}
    scheduler_capabilities:
    - Operating-system preemptive threads
    - Qt queued signals
    - Windows multiprocessing spawn processes
execution_units:
- id: qt-ui-thread
  profile: windows-desktop
  kind: event-loop
  priority: operating-system-default
  affinity: []
  concurrency: 1
  resources:
    memory: Viewport data and immutable presentation snapshots only.
  blocking: Bounded local UI and file-dialog operations only.
  allocation: Python and Qt runtime managed.
- id: analysis-worker
  profile: windows-desktop
  kind: worker-pool
  priority: operating-system-default
  affinity: []
  concurrency: 1
  resources:
    memory: Coordinator state and Qualification score cache; active Learning reserves
      10 percent of total physical RAM and stops when sampled system occupancy exceeds
      90 percent. Process-tree RSS is diagnostic only.
  blocking: Bounded local dataset reads and cooperative cancellation points.
  allocation: Python runtime managed with chunk-bounded temporary arrays.
- id: history-process-workers
  profile: windows-desktop
  kind: worker-pool
  priority: operating-system-default
  affinity: []
  concurrency: 4
  resources:
    memory: Four Windows spawn processes, each owning one dataset copy and one requested-History/fold
      FIR matrix cache; aggregate parent-plus-child Peak RSS is capped at 85 percent
      of launch-time available RAM.
  blocking: CPU-bound NumPy/Python Training with cooperative cancellation and bounded
    IPC polling.
  allocation: Python and NumPy runtime managed; worker-local FIR caches are released
    at process exit.
- id: replay-export-worker
  profile: windows-desktop
  kind: worker-pool
  priority: operating-system-default
  affinity: []
  concurrency: 1
  resources:
    memory: One worker-computed immutable ReplayEvidence or one bounded Model TXT
      line stream plus bounded formatting buffers; no full duplicate artifact string.
  blocking: CPU-bound artifact rendering followed by sequential same-folder temporary-file
    write, flush, and atomic replacement.
  allocation: Python and Qt thread-pool runtime managed.
- id: fold-process-workers
  profile: windows-desktop
  kind: worker-pool
  priority: operating-system-default
  affinity: []
  concurrency: 8
  resources:
    memory: At most eight dataset copies and job-local training arrays. FIR selects
      one to eight workers before spawn to fit the current budget; the batch count
      is then fixed. MLP retains its fixed cap. FIR and MLP estimated additional batch
      bytes must fit current available RAM minus 10 percent of total RAM. Active fold
      execution stops above sampled 90 percent system occupancy. SPEC-0043 Manual
      FIR/MLP count is one to eight capped by jobs; it is rejected if unaffordable,
      never silently reduced. Preview reports estimates only; each real batch refreshes
      memory.
  blocking: CPU-bound fold fitting with bounded IPC polling and terminal cancellation.
  allocation: Python/NumPy managed; no shared mutable model arrays.
- id: qualification-process-workers
  profile: windows-desktop
  kind: worker-pool
  priority: operating-system-default
  affinity: []
  concurrency: 4
  resources:
    memory: At most four complete recording jobs; scores reused per frozen model.
      Active execution stops above sampled 90 percent system occupancy.
  blocking: CPU-bound complete recording replay with bounded IPC polling.
  allocation: Worker-local arrays released after the batch.
execution_mappings:
- id: project-ui-map
  profile: windows-desktop
  workload: project-io
  steps:
  - manage-project.step-1
  units:
  - qt-ui-thread
  serialization: One modal user-approved save/open transaction; active session commit
    occurs only after complete validation.
  reentrant: false
  activation: project command
  wcet: Not established; source hashing is bounded by the declared session source
    files.
- id: diagnostics-ui-map
  profile: windows-desktop
  workload: process-diagnostics
  steps:
  - record-process-diagnostics.step-1
  units:
  - qt-ui-thread
  serialization: The diagnostics adapter serializes writes from the UI and any Qt
    callback thread; no mutable diagnostic state escapes.
  reentrant: false
  activation: process lifecycle or diagnostic observation
  wcet: Not established; records are bounded and rotated.
- id: workspace-ui-map
  profile: windows-desktop
  workload: interactive-workspace
  steps:
  - prepare-workspace.step-1
  - prepare-workspace.step-2
  units:
  - qt-ui-thread
  serialization: Qt event loop serializes committed UI state changes.
  reentrant: false
  activation: user command
  wcet: Not established; p95 is measured by application benchmarks.
- id: analysis-worker-map
  profile: windows-desktop
  workload: analysis-run
  steps:
  - learn-and-qualify.step-1
  units:
  - analysis-worker
  - fold-process-workers
  - qualification-process-workers
  serialization: One active run with one bounded job queue; full-N parameter barriers
    and all fine paths complete before selection. Progress reaches Qt by queued signal.
    Search and Qualification worker batches never overlap.
  reentrant: false
  activation: Start Learning command
  wcet: Not established; bounded parameter domain but data-dependent convergence and
    ties. No wall-clock timeout; cancellation is cooperative at coordinator/job boundaries.
- id: profile-ui-map
  profile: windows-desktop
  workload: profile-write
  steps:
  - export-profile.step-1
  units:
  - qt-ui-thread
  serialization: One user-approved save operation.
  reentrant: false
  activation: export command
  wcet: Not established for local filesystem output.
- id: replay-csv-map
  profile: windows-desktop
  workload: replay-csv-write
  steps:
  - export-replay-csv.step-1
  - export-replay-csv.step-2
  - export-replay-csv.step-3
  units:
  - qt-ui-thread
  - replay-export-worker
  serialization: The UI snapshots one selected complete recording, candidate, and
    destination, permits one active artifact export, and receives one queued terminal
    completion or failure signal.
  reentrant: false
  activation: Replay CSV export command
  wcet: Data-dependent and bounded by the selected recording row count and local filesystem
    behavior.
- id: model-txt-map
  profile: windows-desktop
  workload: model-txt-write
  steps:
  - export-model-txt.step-1
  - export-model-txt.step-2
  - export-model-txt.step-3
  units:
  - qt-ui-thread
  - replay-export-worker
  serialization: The UI snapshots one selected candidate, sample rate, numeric type,
    and destination, shares the one-active-artifact exclusion with Replay CSV, and
    receives one queued terminal completion or failure signal.
  reentrant: false
  activation: Model TXT export command
  wcet: Data-dependent and bounded by tap_count and local filesystem behavior.
execution_channels:
- id: history-worker-ipc
  profile: windows-desktop
  from_unit: analysis-worker
  to_unit: history-process-workers
  contract_refs:
  - learning.history-execution
  capacity: 4
  ordering: FIFO per History attempt; final merge uses declared History order
  copy_policy: Windows spawn pickle copy of immutable domain values
  timeout_ms: 100
  overload: reject
- id: worker-ui-progress
  profile: windows-desktop
  from_unit: analysis-worker
  to_unit: qt-ui-thread
  contract_refs:
  - learning.progressed
  - learning.completed
  - learning.cancelled
  capacity: 2
  ordering: FIFO per event type
  copy_policy: immutable snapshot copy
  timeout_ms: 0
  overload: coalesce
- id: replay-export-command
  profile: windows-desktop
  from_unit: qt-ui-thread
  to_unit: replay-export-worker
  contract_refs:
  - learning.replay-export
  - learning.replay-file-output
  capacity: 1
  ordering: One selected input snapshot per accepted export command
  copy_policy: Immutable selection inputs and NumPy arrays are shared read-only within
    the process; only bounded row text is copied to file buffers.
  timeout_ms: 0
  overload: reject
- id: model-export-command
  profile: windows-desktop
  from_unit: qt-ui-thread
  to_unit: replay-export-worker
  contract_refs:
  - learning.model-export
  - learning.model-file-output
  capacity: 1
  ordering: One selected candidate snapshot per accepted export command
  copy_policy: Immutable candidate parameters are shared read-only within the process;
    only bounded line text is copied to file buffers.
  timeout_ms: 0
  overload: reject
data_access_profiles:
- id: waveform-viewport-buckets
  profile: windows-desktop
  workload: interactive-workspace
  tier: tier-1
  element_size_bytes: 8
  layout: Contiguous row-major NumPy float64 view over three axes with bounded position,
    minimum, maximum, and arithmetic-mean output vectors.
  active_working_set_bytes: 24109280
  stride_bytes: 24
  reuse: Each viewport projection traverses the selected visible slice once; Internal
    and External projections reuse identical integer bucket boundaries.
  alignment_bytes: 8
  sharing: Original arrays are read-only by contract; only bounded immutable projection
    values cross into Qt/QML.
  cache_target: Windows desktop CPU memory hierarchy and installed NumPy implementation.
  candidates:
  - Uniformly sample one point per display column.
  - Reduce every contiguous display bucket to its minimum, maximum, and arithmetic
    mean.
- id: history-fir-matrices
  profile: windows-desktop
  workload: analysis-run
  tier: tier-1
  element_size_bytes: 8
  layout: Row-major NumPy float64 fitting matrices private to one candidate-fold worker,
    with target-dtype evaluation arithmetic.
  active_working_set_bytes: 1
  stride_bytes: 8
  reuse: Effective parameter results are cached per round; dataset inputs are copied
    once per batch worker. Qualification score arrays are computed once per frozen
    fold model and recording and reused across configurations.
  alignment_bytes: 8
  sharing: No writable sharing between workers; immutable job inputs are copied by
    Windows spawn.
  cache_target: Worker process memory hierarchy and NumPy BLAS implementation.
  candidates:
  - Rebuild FIR rows for every rule.
  - Cache complete FIR matrices per History and fold role.
microarchitecture_profiles:
- id: waveform-projection-python-numpy
  profile: windows-desktop
  workload: interactive-workspace
  tier: tier-1
  branches: One deterministic raw-versus-envelope branch plus viewport and input validation.
  simd_eligibility: Min/Max and arithmetic-mean reductions are delegated to the installed
    NumPy backend; no application SIMD claim is made.
  compiler: CPython 3.11+ and installed NumPy binary.
  compiler_flags: Not controlled by the application.
  vectorization_report: Not available for packaged NumPy; the Windows p95 benchmark
    is authoritative.
  pgo: Not controlled by the application.
  lto: Not controlled by the application.
- id: history-training-python-numpy
  profile: windows-desktop
  workload: analysis-run
  tier: tier-1
  branches: FIR segment validation and robust-refit selection remain deterministic
    Python/NumPy branches.
  simd_eligibility: Dense matrix products and linear solves are delegated to the installed
    NumPy backend; Python row construction is not claimed SIMD-vectorized.
  compiler: CPython 3.11+ and installed NumPy binary.
  compiler_flags: Not controlled by the application.
  vectorization_report: Not available for packaged NumPy; runtime benchmark is authoritative.
  pgo: Not controlled by the application.
  lto: Not controlled by the application.
