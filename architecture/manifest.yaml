flows:
- id: manage-project
  owner: studio_application
  description: Save or transactionally reopen one strict external-reference project
    without mutating active state on failure.
  trigger:
    kind: command
    ref: project.command
    description: The user chooses Open Project, Save Project, or Save Project As.
  steps:
  - id: manage-project.step-1
    order: 1
    module: studio_application
    action: Map sibling-owned stable values to or from project_session, verify every
      source identity before commit, restore collision-free session-local manual annotation
      identity allocation without rewriting persisted identities, and invoke project.file-storage
      for strict JSON I/O. Restore frozen model and saved schema-versioned Qualification
      values without Training, Qualification or score replay; preserve legacy aggregate
      summaries and explicitly unavailable missing details.
    receives:
    - project.command
    - project.file-storage
    emits: []
    state_changes: []
    side_effects:
    - Read referenced recording files and one project file, or atomically replace
      one project file.
  success:
    result: The saved artifact is deterministic, or the complete validated project
      replaces the active session, exposes the restored stage, and safely allocates
      later manual annotation identities.
    events: []
  errors: []
- id: record-process-diagnostics
  owner: studio_application
  description: Persist bounded process and Learning execution evidence without changing
    analytical behavior.
  trigger:
    kind: command
    ref: diagnostics.output
    description: The process starts or exits, Learning changes stage/progress, an
      exception is observed, or Qt emits a warning.
  steps:
  - id: record-process-diagnostics.step-1
    order: 1
    module: studio_application
    action: Map the observation to primitive privacy-bounded fields and invoke the
      diagnostics output port.
    receives:
    - diagnostics.output
    emits: []
    state_changes: []
    side_effects:
    - Atomically update the clean-shutdown marker and append a bounded rotated diagnostic
      record through desktop_adapter.
  success:
    result: The latest bounded process or Learning state can be inspected after an
      unclean exit.
    events: []
  errors: []
- id: prepare-workspace
  owner: data_workspace
  description: Import recordings and produce a validated annotated workspace.
  trigger:
    kind: command
    ref: workspace.command
    description: The user advances the import or annotation workflow.
  steps:
  - id: prepare-workspace.step-1
    order: 1
    module: data_workspace
    action: Map QML drag coordinates to sample-index intervals, preserve session-local
      undo history, atomically confirm and activate a selected reference Cycle, generate
      provisional Cycles from one destination Anchor and the reference cadence, project
      provisional events and Ignore reasons only into equal-speed recordings, then
      validate mapping, samples, test conditions, cycles, Ignore reasons, and interval
      partition rules before committing truth. For annotation display, project the
      shared original-sample viewport through ALG-0008 into raw points or deterministic
      width-bounded Min/Max and arithmetic-mean buckets before L0 maps primitives
      to the desktop renderer.
    receives:
    - workspace.command
    - workspace.tabular-input
    emits:
    - workspace.changed
    state_changes: []
    side_effects: []
  - id: prepare-workspace.step-2
    order: 2
    module: studio_application
    action: After successful reference activation, clear both application-owned annotation
      selection representations before publishing refreshed UI state.
    receives:
    - workspace.changed
    emits: []
    state_changes: []
    side_effects: []
  success:
    result: A complete immutable workspace snapshot is available.
    events:
    - workspace.changed
  errors: []
- id: learn-and-qualify
  owner: learning_qualification
  description: Fit candidate kernels and qualify exact target replay across all supplied
    offsets and speeds using nested fallback rounds.
  trigger:
    kind: command
    ref: learning.command
    description: The user selects compatible algorithm/source pairs in Training; L0
      admits every selected recording before dispatching serial immutable requests
      on the existing analysis worker.
  steps:
  - id: learn-and-qualify.step-1
    order: 1
    module: learning_qualification
    action: Capture settings and run seed, preflight complete-Cycle counts, and allocate
      a fresh reproducible round fold map. Check common 128-ms evaluation and threshold
      evidence. In fixed-grid mode dispatch only the deduplicated checked History
      by alpha Cartesian product with Robust K zero and publish every evaluated disposition;
      in optimized mode dispatch the unchanged coarse and joint fine frontiers. Require
      all N results before shared aggregation and publish typed Loss evidence plus
      the rounded round-final Loss.
    receives:
    - learning.command
    - learning.history-execution
    emits:
    - learning.progressed
    state_changes: []
    side_effects: []
  - id: learn-and-qualify.step-2
    order: 2
    module: history_worker_adapter
    action: SPEC-0046 captures the user-selected one-to-eight fold workers, default
      one and capped by jobs, for reusable Windows spawn execution. Whole-recording
      Score and detector replay retain their four-worker cap. No Auto, estimated allocation
      admission, nested pools, retries, runtime resizing or worker-local model selection.
      FIR fitting and scoring use bounded feature blocks and float64 statistics; no
      full row-by-history matrix is retained for FIR. Return immutable job-identified
      results and measured Peak RSS evidence; measured system RAM above the existing
      ceiling, cancellation or unexpected failure terminates and cleans up the complete
      batch.
    receives:
    - learning.history-execution
    emits: []
    state_changes: []
    side_effects:
    - Spawn, monitor, join, or terminate child processes.
  - id: learn-and-qualify.step-3
    order: 3
    module: learning_qualification
    action: Aggregate equal-fold condition losses, retain every parameter within the
      configured relative tolerance of the minimum raw Parameter Loss, apply Validation
      allowance, and retain every fold whose raw maximum-condition Kernel Loss exactly
      equals that parameter's raw minimum while excluding rounded and second-place
      near ties. Publish the current parameter and fold plus completed, remaining,
      and derived total Qualification work. Qualify every admitted original kernel
      without refit before ranking, using the maximum Normal interval maximum as N,
      the minimum of the per-Collision window maxima as C for candidate generation,
      the strict Score-greater-than-Threshold predicate, mandatory all-Collision detection
      within the inclusive 150-ms minus-Ignore deadline, and neutral absence of Normal,
      Pick, or Put classes. Derive chronological per-Collision Detector Score SNR
      from each existing whole-recording Score trace without changing detector decisions.
      Commit every fully qualified selected kernel immediately with its ordered per-recording
      metrics and provenance. On normal completion publish the fallback result; on
      cancellation publish only the committed qualified candidates or, when none qualifies,
      the existing minimum-total-error diagnostic subset while keeping the terminal
      state Cancelled. See ALG-0007, ALG-0006, ALG-0005, ALG-0004 and ALG-0003.
    receives:
    - learning.history-execution
    emits:
    - learning.progressed
    - learning.completed
    - learning.cancelled
    state_changes: []
    side_effects: []
  success:
    result: Retained round winners expose covered offsets, valid speed ranges, minimum-misjudgment
      diagnostic status, and full-resolution selectable Replay evidence; only qualified
      winners remain exportable.
    events:
    - learning.completed
  errors:
  - condition: The user cancels accepted Learning work.
    event: learning.cancelled
    handling: Discard incomplete candidate work, freeze the last complete-candidate
      result, expose qualified candidates or the diagnostic fallback in Replay, and
      retain the Cancelled terminal state.
- id: export-profile
  owner: profile_export
  description: List all qualified frozen kernels with history, threshold and coverage
    for independent JSON export by kernel ID, with explicit name and file selection;
    retain header rendering for existing callers. New firmware JSON omits event release
    fields and accepts current shared-policy Qualification evidence without a separate
    deployment validation step. Application-owned background work snapshots inputs,
    checks evidence, renders and writes atomically while projecting real busy state.
    Missing or stale evidence requires Qualification from Replay. Historic headers
    and existing schema-1/schema-2 signal-format contracts remain unchanged.
  trigger:
    kind: command
    ref: profile.command
    description: The user exports any checked qualified kernels to one folder.
  steps:
  - id: export-profile.step-1
    order: 1
    module: profile_export
    action: Validate each qualified frozen profile, preserve execution settings and
      precision, render deterministic header or JSON content, and request individually
      approved atomic file writes.
    receives:
    - profile.command
    emits:
    - profile.exported
    state_changes: []
    side_effects:
    - Write selected header files through profile.file-output, replacing only files
      explicitly approved by the user.
  success:
    result: Separate C99 or C++17 profile headers are saved for all non-skipped kernels.
    events:
    - profile.exported
  errors: []
- id: export-replay-csv
  owner: studio_application
  description: Export one selected kernel and recording as a full-resolution diagnostic
    CSV without rendering Replay waveform charts.
  trigger:
    kind: command
    ref: learning.replay-export
    description: The user chooses a CSV destination after selecting a retained kernel
      and recording in Replay.
  steps:
  - id: export-replay-csv.step-1
    order: 1
    module: studio_application
    action: Resolve and snapshot the selected complete recording, candidate, and destination,
      reject unavailable or concurrent work, and dispatch one background export.
    receives:
    - learning.replay-export
    emits:
    - replay.exported
    - replay.export-failed
    state_changes: []
    side_effects:
    - Schedule one QRunnable on the Qt thread pool.
  - id: export-replay-csv.step-2
    order: 2
    module: learning_qualification
    action: Stream the exact ordered diagnostic columns and every aligned sample without
      changing Replay numeric or detector semantics.
    receives:
    - learning.replay-export
    emits: []
    state_changes: []
    side_effects: []
  - id: export-replay-csv.step-3
    order: 3
    module: desktop_adapter
    action: Write UTF-8 CSV rows to a same-folder temporary file, flush them, and
      atomically replace the selected destination.
    receives:
    - learning.replay-file-output
    emits: []
    state_changes: []
    side_effects:
    - Atomically replace one user-selected CSV file.
  success:
    result: One complete CSV for the selected kernel and recording is saved and the
      UI reports its path.
    events:
    - replay.exported
  errors:
  - condition: Replay evidence is unavailable or another export is active.
    event: replay.export-failed
    handling: Preserve the current session and show the rejection in the status bar.
  - condition: Rendering or atomic file output fails.
    event: replay.export-failed
    handling: Preserve any previous destination and report the bounded failure message
      on the UI thread.
- id: export-model-txt
  owner: studio_application
  description: Export one selected retained kernel as a deterministic standalone Model
    TXT artifact.
  trigger:
    kind: command
    ref: learning.model-export
    description: The user chooses a TXT destination after selecting a retained kernel
      in Replay.
  steps:
  - id: export-model-txt.step-1
    order: 1
    module: studio_application
    action: Resolve and snapshot the selected candidate, sample rate, numeric type,
      and destination, reject unavailable or concurrent work, and dispatch one background
      export.
    receives:
    - learning.model-export
    emits:
    - model.exported
    - model.export-failed
    state_changes: []
    side_effects:
    - Schedule one QRunnable on the Qt thread pool.
  - id: export-model-txt.step-2
    order: 2
    module: learning_qualification
    action: Stream deterministic scalar metadata and named FIR weights, bias, residual
      center, and residual scale sections without changing numeric values.
    receives:
    - learning.model-export
    emits: []
    state_changes: []
    side_effects: []
  - id: export-model-txt.step-3
    order: 3
    module: desktop_adapter
    action: Write UTF-8 LF-delimited lines to a same-folder temporary file, flush
      them, and atomically replace the selected destination.
    receives:
    - learning.model-file-output
    emits: []
    state_changes: []
    side_effects:
    - Atomically replace one user-selected TXT file.
  success:
    result: One complete Model TXT for the selected kernel is saved and the UI reports
      its path.
    events:
    - model.exported
  errors:
  - condition: Model evidence is unavailable or another artifact export is active.
    event: model.export-failed
    handling: Preserve the current session and show the rejection in the status bar.
  - condition: Rendering or atomic file output fails.
    event: model.export-failed
    handling: Preserve any previous destination and report the bounded failure message
      on the UI thread.
